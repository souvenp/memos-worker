name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "c4896380-1d61-454e-b139-300da7052ef3"
database_name = "notes-db"

[[kv_namespaces]]
binding = "notes_kv"
id = "a3fdcf4828b74e99b3a62c90fa4a643a"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
